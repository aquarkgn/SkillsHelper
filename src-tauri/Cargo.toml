[package]
name = "skillhelper-desktop"
version = "3.9.1"
description = "SkillHelper 本地 AI 编辑器资产扫描与中文本地化桌面应用"
authors = ["SkillHelper Contributors"]
license = "MIT"
repository = "https://github.com/aquarkgn/HuHaa-SkillHelper"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "skillhelper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.8.2", features = ["protocol-asset"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"
